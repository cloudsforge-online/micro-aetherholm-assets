name: CI

# A content repository: no service, no suite, no image. What CI owes it is the check that guards
# the failure that cannot be undone — a committed secret is compromised the moment it lands —
# and the repository's own verifier. micro-brand's verify.py existed, passed, and was run by
# nobody, which is how 54 entries shipped claiming a C2PA box the bytes had lost; and
# micro-emberkin-assets' CI still runs only hygiene, which is how two favicons landed there with
# no manifest entry at all. A manifest is a claim about files, and a claim nothing re-checks is
# a claim that drifts the first time the files move.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    with:
      require-dockerignore: false
    permissions:
      contents: read

  manifest:
    name: verify.py
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pillow is the only dependency, and only for decoding pixels.
      - run: python3 -m pip install --disable-pip-version-check --quiet pillow
      # BEFORE the run, not after, and it needs no images or keys. `check_parity` compares sets to
      # each other and there has been one set on disk since the Qwen challenger was withdrawn, so
      # it is DORMANT — it returns clean because it was handed one document, not because it looked
      # and found nothing. `--self-test` hands the real function two-set fixtures with a
      # deliberately broken asset and fails if it stays green, which is the difference between
      # "nothing is wrong" and "nothing is looking". The verifier's own exit code cannot tell them
      # apart, and a check that lost its operand is this estate's most-repeated defect.
      - name: the cross-set guard still fails when broken
        run: python3 verify.py --self-test
      - run: python3 verify.py
      # Every file in assets/ must be accounted for by the manifest — the emberkin-assets gap
      # (files on disk with no provenance entry) run in the other direction to verify.py's
      # manifest->file checks.
      - name: every asset file has a manifest entry
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          here = pathlib.Path('.')
          recorded = {a['path'] for a in json.loads((here / 'MANIFEST.json').read_text())['assets']}
          on_disk = {str(p) for p in here.glob('assets/**/*.png')}
          orphans = sorted(on_disk - recorded)
          for path in orphans:
              print(f'{path}: on disk with no manifest entry', file=sys.stderr)
          sys.exit(1 if orphans else 0)
          EOF

  # ── A picture of a mechanic is a claim about another repository ─────────────────────────────
  #
  # verify.py checks bytes against the manifest. It cannot check the one thing this README says
  # that is not about bytes: that `icons/status-population` is an icon for a citizen count. Three
  # of the 101 illustrate a game that was designed (doc 20 §8) and not built, and until 2026-08-10
  # the README described all of them as though the game had them — while a fourth, the Private
  # Skerry, was being treated estate-wide as a gap although micro-aetherholm provisions and sells
  # one. Both errors are invisible to a verifier that only weighs pixels, and both rot the same
  # way: nothing re-reads prose.
  #
  # This job is separate from the manifest job because it needs a second checkout and a token,
  # and a set with no sibling beside it must not silently pass — gaps.py exits 2, never 0.
  gaps:
    name: gaps.py
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checked out into a NAMED directory rather than the workspace root, because gaps.py looks
      # for the service beside this repository the way a developer's estate has it. `path:` must
      # stay inside the workspace, so both checkouts are siblings within it.
      - uses: actions/checkout@v4
        with: { path: aetherholm-assets }
      # src only: gaps.py reads the service's TypeScript and runs nothing.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-aetherholm
          path: aetherholm
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No Pillow: this reads text. Standard library only, like normalise_ground.py.
      - name: the README describes the game that was built
        working-directory: aetherholm-assets
        run: |
          set -euo pipefail
          out=$(python3 gaps.py 2>&1) && status=0 || status=$?
          printf '%s\n' "$out"
          # Read from a here-string rather than piping into grep: `grep -q` exits at its first
          # match, the producer takes EPIPE, and under pipefail a MATCH is scored as a failure.
          if grep -q '^UNCHECKED' <<<"$out"; then
            echo "::error::micro-aetherholm was not checked out; the mechanic claims were never measured"
            exit 1
          fi
          [ "$status" -eq 0 ] || exit "$status"
